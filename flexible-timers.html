<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flexible Timers</title>
  <style>
    body {
      background: #f4f4f4;
      color: #222;
      font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
    }

    main {
      margin: 0 auto;
      max-width: 1280px;
      padding: 48px 48px 64px;
    }

    h1 {
      font-size: 44px;
      margin: 0 0 8px;
    }

    p {
      color: #555;
      margin: 0 0 28px;
      max-width: 760px;
    }

    .screenshots {
      display: grid;
      gap: 36px;
    }

    figure {
      background: white;
      border: 1px solid #d8d8d8;
      margin: 0;
      padding: 16px;
    }

    img {
      display: block;
      height: auto;
      width: 100%;
    }

    figcaption {
      color: #555;
      font-size: 15px;
      margin-top: 10px;
    }

    footer {
      color: #555;
      margin-top: 36px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Flexible Timers</h1>
    <p>
      Flexible Timers is a macOS app for timers, countdowns, clocks, and reminder workflows.
    </p>

    <div class="screenshots">
      <figure>
        <img src="assets/flexible-timers-overview.webp" alt="Flexible Timers double-column timer list">
        <figcaption>Main window with double-column layout.</figcaption>
      </figure>

      <figure>
        <img src="assets/flexible-timers-focused.webp" alt="Flexible Timers single-column timer list">
        <figcaption>Main window with focused single-column layout.</figcaption>
      </figure>

      <figure>
        <img src="assets/flexible-timers-timer-task.webp" alt="Flexible Timers add timer task dialog">
        <figcaption>Add Timer Task dialog.</figcaption>
      </figure>

      <figure>
        <img src="assets/flexible-timers-countdown.webp" alt="Flexible Timers add countdown task dialog">
        <figcaption>Add CountDown Task dialog.</figcaption>
      </figure>
    </div>

    <footer>(c) 2026 Xintech LLC. All rights reserved.</footer>
  </main>
</body>
</html>
